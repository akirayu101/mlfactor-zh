# 因子投资中的机器学习
## 导论
### Guillaume Coqueret
### .font80[Cass <strong>AIR-Q</strong> 研讨会] 2020-09-02

---


# 演讲目的

本次演讲概述因子建模中的机器学习，重点关注**金融经济学**，并讨论这一方法的重要局限。

人们初学机器学习时，往往会把注意力放在**技术细节**上，这很合理（.grey[.font90[毕竟还要应对面试问题！]]）。

.font90[问题在于，他们常常只把数据看作输入机器学习算法的原料，这是一种纯计算机科学视角。

作为起点尚可，但在实践中是**错误的**！.bluen[结合具体情境]至关重要。]



---
# 为什么用机器学习交易？

.font120[
1. 因为 .bluen[**我们做得到**]（数据更易获得、开源软件普及、学术研究日趋成熟）。
2. 因为它看起来**新潮**（很适合市场宣传）。
3. 因为它**有效**（不过……视情况而定）。
]


---
# 这一交叉领域

很多人把机器学习视为一根**魔杖**（.grey[.font90[技术如此复杂，掌握它的人既聪明又能赚钱]]）。.font110[**错！**]

.font90[要让机器学习真正发挥作用，必须理解它所处的**环境**。例如，这需要了解**公司金融**（因子投资）、**市场微观结构**（高频交易）和**信贷行业**（信用评分）。`\(\rightarrow\)` 也就是领域专业知识。

这是作出 .bluen[**明智建模决策**]的前提（.grey[.fot80[例如选择超参数]]）。

对于因子投资，.bluen[**资产定价模型**]乃至更广泛的金融经济学都是关键。]

# 因子模型入门


---
class: animated, fadeInRight


# 方程 .grey[.font60[（只有一个，但必须真正理解）]]

.bib[
方程如下*：
`$$r_i= f(\textbf{x}_i) + e_i,$$`

- `\(r_i\)` 是公司 `\(i\)` 的（未来）收益率；
- `\(f\)` 是某个函数，可能取决于若干*超参数*；
- `\(\textbf{x}_i\)` 是 .bluen[公司特征]（市值、盈利/债务比率、历史收益率等）；
- `\(e_i\)` 是模型（`\(f(\textbf{x}_i)\)`）的误差。

**注意**：这是一个**面板**模型，`\(f\)` 对所有股票都相同。

*.grey[.font70[这是简化形式：它可以（也许应该）随时间变化。]]
]

---
# 一个简单例子


假设

`$$r_i = a + b*\text{Size}_i + e_i,$$`
其中 Size 是公司规模的**代理变量**，例如经过缩放、归一化或标准化的市值。<br>
若 `\(b&gt;0\)`：根据模型，大公司获得更高收益率。<br>
`\(\rightarrow\)` 通常认为 `\(b&lt;0\)`：小公司具有更大的**增长**潜力，因而表现更好，后文还会讨论。<br>
这与所谓的**规模溢价**（或规模异象）有关。
.font70[.grey[异象还有很多，例如价值、动量、低风险（？）、盈利能力等。]]


---
# 一般化

可作如下扩展：
- 加入更多公司特征（会计比率、风险、情绪、.bluen[ESG] 等）；
- 超越线性函数形式（机器学习由此进入）；
- 强化条件性，例如加入宏观经济指标。

**但是**！必须始终警惕误差项 `\(e_i\)`！它服从高斯分布吗？在时间序列和横截面上相互独立吗？<br>
未必如此……

# 因子模型的局限


---
# 第一个问题：噪声！（1/2）

理想情形：低噪声（示意图）。

---
# 第一个问题：噪声！（2/2）

另一种情形：噪声淹没信号（更贴近现实）。

&lt;img src="SLIDES_files/figure-html/unnamed-chunk-2-1.png" style="display: block; margin: auto;" /&gt;

.font70[实践中的情况复杂得多，例如预测变量众多、关系非线性等。]


---
# 用多个特征说明非线性

一棵简单的决策树。

&lt;img src="trees.png" width="530px" style="display: block; margin: auto;" /&gt;


---
# 第二个问题：一切都会随时间变化（1/2）

.font90[平均收益率、波动率、因子载荷，都会] .font110[**变化**]！.font80[（无套利……）]

&lt;img src="SLIDES_files/figure-html/unnamed-chunk-4-1.png" style="display: block; margin: auto;" /&gt;

---
# 第二个问题：一切都会随时间变化（2/2）

有什么解决办法？

- 首先，确保模型能够随新数据演化并作出反应！一种常见倾向是把模型一次设定后便永远**固定**，这是错误的。持续更新至关重要，尽管具体做法绝不简单。
- 其次，要拓宽视野。**宏观经济**能否解释部分变化？股票不会无缘无故波动……信用利差可能影响规模因子。预测模型可以通过多种方式纳入宏观经济指标。


---
# 第三个问题：算法过拟合（1/2）

大模型 `\(\neq\)` 更好的模型。（下图是夸张示例）

&lt;img src="SLIDES_files/figure-html/unnamed-chunk-5-1.png" style="display: block; margin: auto;" /&gt;

---
# 第三个问题：算法过拟合（2/2）

应对过拟合的一些**方法**：
- 许多方法具有技术性，且取决于具体算法。回归、树模型和神经网络的惩罚方式各不相同，需要实践经验。
- 一条启发式建议是：.bluen[避免复杂模型]！
- 若确实需要复杂模型，应投入更多时间进行稳健性检验，包括超参数和时间窗口检验。



---
# 第四个问题：回测过拟合（1/3）

.font90[设想一位量化基金经理拥有 5 套建模引擎]（.font80[随机森林、提升树、神经网络、循环神经网络、集成模型]）。
.font90[假设她希望为每类模型测试 10 个超参数值，用来评估敏感性，而这已经算很少。<br>
于是共有 50 种组合。再假设有 5 种方法把预测信号转换为投资组合权重。]
`\(\rightarrow\)` 最终会产生 250 种策略构造方案。


.font90[.grey[这甚至还没有计入数据预处理。]] 😉

---
# 第四个问题：回测过拟合（2/3）

.font90[基金经理会对这些策略进行**回测**，即用数据检验策略。遗憾的是，她手中只有历史数据……最后，她会在完成稳健性检验、敏感性分析等工作后，选出表现最好的策略。]

这个选择真的最好吗？它在实盘交易，即样本外环境中还能表现良好吗？可能不会，因为该策略只针对一份数据集进行了优化！.font70[.grey[在因子投资中，人工生成可信数据十分困难。]]

一条经验法则：将最佳策略的夏普比率 .bluen[除以二]，可能更接近未来表现。

---
# 第四个问题：回测过拟合（3/3）

这与 .bluen[可重复性]危机有关：

- 学术研究受“*不发表就出局*”范式困扰，并强烈偏好正向结果。
- 同样，资产管理者也承受设计**制胜策略**的压力，却只能使用历史数据回测。

`\(\rightarrow\)` 这会推动我们产生**假阳性**。我们太想找到成功配方，以至于忘记自己所处的研究框架。许多最佳策略只是偶然表现良好，也就是恰好遇到一条幸运的世界随机路径！

---
# 总结：关键要点

因子投资旨在利用 .bluen[公司特征]解释或预测金融资产收益率。

人们往往专注于模型复杂度。复杂模型有时确实能增加价值，但需要深厚的专业知识。更多时候，应投入更多时间研究**简单方法**，并形成对模型的整体理解。

本次演讲没有展开的一个重要议题是**因果关系**。它极其重要，但在我看来，目前仍难以在因子投资中可靠识别。


---
# 给学生的几点建议


重视 .bluen[深入理解]。彻底掌握**线性回归**等简单对象和概念，好过对神经网络只有浅层认识。

重点学习基础统计、优化和 .bluen[金融经济学]。要持续编程，但也要**有思考地编程**。

独立思考，多读多写，不要自欺：一旦产生疑问或迟疑，就回到问题本身继续研究。
